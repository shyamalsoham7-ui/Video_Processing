<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoProcessor // NeuralCore</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>[ <span class="highlight">VideoProcessor</span>_Engine v1.0 ]</h1>
            <p>Upload source media (up to 60 mins) for deep extraction: frames, scenes, motion, tracking, and summary.</p>
        </header>

        <div class="upload-section" id="upload-box">
            <form id="upload-form">
                <input type="file" id="video-input" name="video" accept="video/mp4,video/x-m4v,video/*" required>
                <label for="video-input" class="file-label">SELECT VIDEO FILE</label>
                <div id="file-name" class="file-name">No file selected</div>
                <button type="submit" class="cyber-button" id="submit-btn">INITIATE_PROCESSING()</button>
            </form>
        </div>

        <div class="progress-section hidden" id="progress-section">
            <h3>Processing Engine Active</h3>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="status-text" id="status-text">Uploading to secure buffer...</div>
        </div>

        <div class="results-section hidden" id="results-section">
            <h2>Extraction Complete</h2>
            <div class="results-grid" id="results-grid"></div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
